<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - FitConsult Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="db.js"></script>
    <script>
        // Protecao de sessao: bloqueia acesso direto sem login
        if (sessionStorage.getItem('fitconsult_admin_logged') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <h2>FitConsult</h2>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="alunos.html" class="nav-link">
                        <i class="fas fa-users"></i>
                        <span>Alunos</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="agenda.html" class="nav-link">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Agenda</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="treinos.html" class="nav-link">
                        <i class="fas fa-dumbbell"></i>
                        <span>Treinos</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="avaliacoes.html" class="nav-link">
                        <i class="fas fa-chart-line"></i>
                        <span>Avaliações</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="evolucao.html" class="nav-link">
                        <i class="fas fa-chart-bar"></i>
                        <span>Evolução</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="financeiro.html" class="nav-link">
                        <i class="fas fa-money-bill-wave"></i>
                        <span>Financeiro</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="relatorios.html" class="nav-link">
                        <i class="fas fa-chart-pie"></i>
                        <span>Relatórios</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="configuracoes.html" class="nav-link">
                        <i class="fas fa-cog"></i>
                        <span>Configurações</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <div class="admin-profile">
                <img src="https://via.placeholder.com/44" alt="Admin" class="admin-avatar">
                <div class="admin-info">
                    <h3>Administrador</h3>
                    <p>Último acesso: hoje</p>
                </div>
            </div>
        </div>
    </div>

    <main class="main-content">
        <header class="main-header">
            <div class="header-left">
                <button class="sidebar-toggle-mobile" id="sidebarToggleMobile">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Agenda</h1>
            </div>

            <div class="header-right">
                <div class="search-box">
                    <input type="text" placeholder="Buscar atendimentos...">
                    <i class="fas fa-search"></i>
                </div>

                <div class="notifications">
                    <i class="fas fa-bell notification-icon"></i>
                    <span class="notification-badge" id="notificationCount">0</span>
                </div>

                <div class="user-profile">
                    <img src="https://via.placeholder.com/48" alt="User" class="user-avatar">
                    <div class="user-info">
                        <span class="user-name">Administrador</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>

                <button id="logoutBtn" title="Sair" style="background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:0.9rem;">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </header>

        <section class="dashboard-content" style="padding: 30px;">
            <!-- Header with actions -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h2>Agendamentos</h2>
                    <p class="stat-label" style="color: var(--ink-dim); margin-top: 5px;">
                        {{totalAppointments}} agendamentos este mês
                    </p>
                </div>
                <button id="addAppointmentBtn" class="login-btn" style="padding: 12px 25px;">
                    <i class="fas fa-calendar-plus"></i> Novo Agendamento
                </button>
            </div>

            <!-- Calendar view tabs -->
            <div style="background: var(--glass); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 25px;">
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <button id="dayView" class="tab-btn active">Dia</button>
                    <button id="weekView" class="tab-btn">Semana</button>
                    <button id="monthView" class="tab-btn">Mês</button>
                </div>
            </div>

            <!-- Agenda content -->
            <div id="agendaContent" style="background: var(--glass); border-radius: var(--radius-lg); min-height: 500px;">
                <!-- Content will be loaded based on view -->
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAgenda('month'); // Default to month view
            updateNotificationCount();
            setupEventListeners();
        });

        function loadAgenda(view = 'month') {
            const content = document.getElementById('agendaContent');
            const appointments = db.getAppointments();

            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.id === `${view}View`);
            });

            // Load appropriate view
            if (view === 'day') {
                loadDayView(appointments);
            } else if (view === 'week') {
                loadWeekView(appointments);
            } else {
                loadMonthView(appointments);
            }
        }

        function loadDayView(appointments) {
            const today = new Date().toISOString().split('T')[0];
            const todaysAppointments = appointments.filter(a => a.date === today).sort((a, b) =>
                a.time.localeCompare(b.time)
            );

            const content = document.getElementById('agendaContent');

            if (todaysAppointments.length === 0) {
                content.innerHTML = `
                    <div style="text-align: center; padding: 60px; color: var(--ink-dim);">
                        <i class="fas fa-calendar-check" style="font-size: 48px; margin-bottom: 20px; opacity: 0.5;"></i>
                        <p>Nenhum agendamento para hoje.</p>
                    </div>
                `;
                return;
            }

            let html = `<div style="padding: 20px;">`;
            html += `<h3 style="color: var(--accent); margin-bottom: 20px;">Hoje, ${new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'})}</h3>`;

            todaysAppointments.forEach(appointment => {
                const student = db.getStudentById(appointment.studentId);
                html += `
                    <div style="background: var(--glass-strong); border-radius: var(--radius-md); padding: 15px; margin-bottom: 15px; display: flex; align-items: start;">
                        <div style="flex: 0 0 60px; text-align: center;">
                            <div style="font-size: 1.8rem; font-weight: 700; color: var(--accent);">${appointment.time}</div>
                            <div style="font-size: 0.9rem; color: var(--ink-dim);">${new Date(appointment.date).toLocaleDateString('pt-BR', {weekday: 'short'})}</div>
                        </div>
                        <div style="flex: 1; padding-left: 20px;">
                            <h4 style="margin: 0 0 8px 0; color: var(--ink);">${student ? student.name : 'Aluno não encontrado'}</h4>
                            <p style="margin: 0 0 6px 0; color: var(--ink-dim);"><strong>Tipo:</strong> ${appointment.type}</p>
                            <p style="margin: 0 0 6px 0; color: var(--ink-dim);"><strong>Duração:</strong> ${appointment.duration} minutos</p>
                            ${appointment.observations ? `<p style="margin: 0; color: var(--ink-dim); font-style: italic;">${appointment.observations}</p>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            content.innerHTML = html;
        }

        function loadWeekView(appointments) {
            const content = document.getElementById('agendaContent');
            content.innerHTML = `
                <div style="text-align: center; padding: 60px; color: var(--ink-dim);">
                    <i class="fas fa-chart-bar" style="font-size: 48px; margin-bottom: 20px; opacity: 0.5;"></i>
                    <p>Visualização semanal em desenvolvimento.</p>
                    <p>Utilize a visualização mensal ou diária por enquanto.</p>
                </div>
            `;
        }

        function loadMonthView(appointments) {
            const content = document.getElementById('agendaContent');

            // Group appointments by date
            const appointmentsByDate = {};
            appointments.forEach(appt => {
                if (!appointmentsByDate[appt.date]) {
                    appointmentsByDate[appt.date] = [];
                }
                appointmentsByDate[appt.date].push(appt);
            });

            const sortedDates = Object.keys(appointmentsByDate).sort();

            let html = `<div style="padding: 20px;">`;

            if (sortedDates.length === 0) {
                html += `
                    <div style="text-align: center; padding: 60px; color: var(--ink-dim);">
                        <i class="fas fa-calendar" style="font-size: 48px; margin-bottom: 20px; opacity: 0.5;"></i>
                        <p>Nenhum agendamento cadastrado.</p>
                    </div>
                `;
            } else {
                sortedDates.forEach(date => {
                    const dateObj = new Date(date);
                    const dayAppointments = appointmentsByDate[date].sort((a, b) =>
                        a.time.localeCompare(b.time)
                    );

                    html += `
                        <div style="margin-bottom: 30px;">
                            <h4 style="color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 8px;">
                                ${dateObj.toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'})}
                            </h4>
                            <div style="margin-top: 15px;">
                    `;

                    dayAppointments.forEach(appt => {
                        const student = db.getStudentById(appt.studentId);
                        html += `
                            <div style="background: var(--glass-strong); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; display: flex; align-items: center;">
                                <div style="flex: 0 0 50px; text-align: center;">
                                    <div style="font-size: 1.2rem; font-weight: 600; color: var(--accent);">${appt.time}</div>
                                </div>
                                <div style="flex: 1; padding-left: 12px;">
                                    <div style="font-weight: 600; color: var(--ink);">${student ? student.name : 'Aluno não encontrado'}</div>
                                    <div style="font-size: 0.9rem; color: var(--ink-dim);">${appt.type}</div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });
            }

            html += `</div>`;
            content.innerHTML = html;
        }

        function setupEventListeners() {
            // View tabs
            document.getElementById('dayView').addEventListener('click', function() {
                loadAgenda('day');
            });

            document.getElementById('weekView').addEventListener('click', function() {
                loadAgenda('week');
            });

            document.getElementById('monthView').addEventListener('click', function() {
                loadAgenda('month');
            });

            // Add appointment button
            document.getElementById('addAppointmentBtn').addEventListener('click', function() {
                // Simple demonstration - in reality this would open a modal/form
                const students = db.getStudents();
                if (students.length === 0) {
                    alert('⚠️ Cadastre pelo menos um aluno antes de criar agendamentos.');
                    return;
                }

                const studentNames = students.map(s => `${s.id}: ${s.name}`).join('\n');
                const studentIdStr = prompt(`Selecione o aluno pelo ID:\n\n${studentNames}`);

                if (studentIdStr === null) return; // User cancelled

                const studentId = parseInt(studentIdStr);
                const student = db.getStudentById(studentId);

                if (!student) {
                    alert('❌ Aluno não encontrado.');
                    return;
                }

                const date = prompt('Data do agendamento (AAAA-MM-DD):', new Date().toISOString().split('T')[0]);
                if (!date) return;

                const time = prompt('Horário (HH:MM):', '09:00');
                if (!time) return;

                const typeOptions = ['Avaliação', 'Consultoria', 'Revisão de treino', 'Reavaliação', 'Atendimento online', 'Reunião'];
                const type = prompt(`Tipo de atendimento:\n${typeOptions.map((t, i) => `${i+1}. ${t}`).join('\n')}`, 'Consultoria');
                if (!type) return;

                const durationStr = prompt('Duração em minutos:', '60');
                const duration = parseInt(durationStr) || 60;

                const observations = prompt('Observações (opcional):') || '';

                const newAppointment = {
                    studentId: student.id,
                    date: date,
                    time: time,
                    type: type,
                    duration: duration,
                    observations: observations,
                    status: 'Confirmado'
                };

                try {
                    db.saveAppointment(newAppointment);
                    alert('✅ Agendamento criado com sucesso!');
                    loadAgenda('month'); // Refresh current view
                } catch (error) {
                    alert('❌ Erro ao criar agendamento: ' + error.message);
                }
            });
        }

        function updateNotificationCount() {
            const count = db.getNotifications().filter(n => !n.isRead).length;
            document.getElementById('notificationCount').textContent = count;
        }

        // Sidebar toggle functionality
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarToggleMobile = document.getElementById('sidebarToggleMobile');
        const sidebar = document.querySelector('.sidebar');
        const mainContent = document.querySelector('.main-content');

        sidebarToggle.addEventListener('click', function() {
            sidebar.classList.toggle('collapsed');
            if (sidebar.classList.contains('collapsed')) {
                sidebar.style.width = '80px';
                mainContent.style.marginLeft = '80px';
                document.querySelectorAll('.sidebar-logo h2, .sidebar-nav .nav-link span, .sidebar-footer .admin-info').forEach(el => {
                    el.style.display = 'none';
                });
            } else {
                sidebar.style.width = '280px';
                mainContent.style.marginLeft = '280px';
                document.querySelectorAll('.sidebar-logo h2, .sidebar-nav .nav-link span, .sidebar-footer .admin-info').forEach(el => {
                    el.style.display = 'block';
                });
            }
        });

        sidebarToggleMobile.addEventListener('click', function() {
            sidebar.classList.toggle('mobile-open');
            if (sidebar.classList.contains('mobile-open')) {
                sidebar.style.width = '280px';
                sidebar.style.visibility = 'visible';
            } else {
                sidebar.style.width = '0';
                sidebar.style.visibility = 'hidden';
            }
        });

        document.addEventListener('click', function(e) {
            if (!sidebar.contains(e.target) && !sidebarToggleMobile.contains(e.target) && sidebar.classList.contains('mobile-open')) {
                sidebar.classList.remove('mobile-open');
                sidebar.style.width = '0';
                sidebar.style.visibility = 'hidden';
            }
        });
    
        // Logout
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                sessionStorage.removeItem('fitconsult_admin_logged');
                window.location.href = 'index.html';
            });
        }
</script>

    <style>
        .tab-btn {
            background: var(--glass);
            border: 1px solid var(--line);
            color: var(--ink-dim);
            padding: 10px 20px;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .tab-btn.active {
            background: var(--glass-strong);
            color: var(--ink);
            border-bottom-color: var(--accent);
            position: relative;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .tab-btn:hover:not(.active) {
            background: var(--glass-strong);
            color: var(--ink);
        }
    </style>
</body>
</html>
